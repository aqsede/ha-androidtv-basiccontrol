plugins {
    id 'com.android.application'
}

android {
    namespace 'io.hapanel.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'io.hapanel.tv'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
// No dependencies on purpose: plain framework views, HttpURLConnection and org.json.
